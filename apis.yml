aid: babylon-labs
name: Babylon Labs
description: >-
  Babylon Labs builds the Bitcoin staking protocol that lets BTC holders secure
  Proof-of-Stake networks without custody, bridges, or wrapping. BTC is locked in
  time-locked covenant scripts on Bitcoin L1 and delegated to finality providers,
  providing Bitcoin-grade economic security to Cosmos chains, rollups, and other
  Bitcoin Supercharged Networks (BSNs) while stakers retain self-custody. Its mainnet,
  Babylon Genesis, launched April 2025 on CometBFT with CosmWasm smart contracts and
  the BABY native token. Babylon exposes a public Babylon Staking API for querying
  delegations, finality providers, network parameters, stats, prices, and APR, plus
  Go and TypeScript SDKs, node/operator daemons, and CosmWasm contracts.
