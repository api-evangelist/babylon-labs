overlay: 1.0.0
info:
  title: API Evangelist enhancements for Babylon Staking API
  version: 1.0.0
extends: openapi/babylon-labs-staking-api-openapi-original.yml
actions:
- target: $.info
  update:
    x-apievangelist-enriched: '2026-07-18'
    x-api-base-url: https://staking-api.babylonlabs.io
    x-agentic-access: agentic-access/babylon-labs-agentic-access.yml
    x-error-catalog: errors/babylon-labs-problem-types.yml
    x-conventions: conventions/babylon-labs-conventions.yml
    x-data-model: data-model/babylon-labs-data-model.yml
- target: $.info
  description: Record cursor-pagination convention captured in conventions/.
  update:
    x-pagination:
      style: cursor
      request_param: pagination_key
      response_field: pagination.next_key
